name: Publish MkDocs via GitHub Actions

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # git-revision-date-localized 与 git-authors 需要完整提交历史，
          # 默认的浅克隆会导致日期与作者读取失败。
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Deploy site
        run: mkdocs gh-deploy --force
